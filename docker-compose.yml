# Local stack: the gateway, plus Prometheus so the metrics endpoint has
# somewhere to go.
#
# PostgreSQL is included but commented out, because the point of the default
# here is a stack that needs nothing else. The backend itself is not unverified:
# CI runs the whole suite against postgres:16, so uncommenting this is switching
# to a tested backend rather than adopting an untested one. Two things come with
# it -- install the `postgres` extra for the driver, and run
# `alembic upgrade head`, since the service will not create a server database's
# schema on its own.

services:
  permgate:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PERMGATE_DATABASE_URL: sqlite+pysqlite:////data/permgate.db
      PERMGATE_LOG_JSON: "true"
      PERMGATE_LOG_LEVEL: INFO
      # Identity is on, so the stack needs a way in or it will not start. This
      # default exists so `docker compose up` works on a laptop; it is not a
      # secret and must not be carried anywhere real -- set the variable, or
      # provision a client with `permgate client create` and unset it.
      PERMGATE_AUTH_BOOTSTRAP_TOKEN: ${PERMGATE_AUTH_BOOTSTRAP_TOKEN:-local-dev-token-not-for-anything-else}
      # Only the working directory the image runs in, deliberately not "/".
      PERMGATE_AUTH_BOOTSTRAP_ROOTS: '["/app"]'
      # Off by default. Turning this on in a shared environment hands every
      # client the ability to skip consent entirely.
      PERMGATE_ALLOW_BYPASS_MODE: "false"
      PERMGATE_ALLOW_CLIENT_SUPPLIED_MODE: "false"
    volumes:
      - permgate-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).status==200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - permgate
    restart: unless-stopped

  # postgres:
