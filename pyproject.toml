[project]
name = "permgate"
version = "0.1.0"
description = "Permission gateway for AI agent tool calls: a decision service with project-scoped grants, an immutable audit trail and offline quality evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "prometheus-client>=0.20",
    "structlog>=24.1",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
# A server database needs a driver. Kept apart from the core dependencies so the
# default SQLite install stays small, and named for the URL it enables:
# ``postgresql+psycopg://``.
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # The CI `test` and `postgres` jobs run pytest with `--cov` and
    # `--cov-fail-under=90`. Those flags are provided by this plugin, and
    # without it pytest does not skip the coverage step -- it exits 4 with
    # "unrecognized arguments", so both jobs failed before running a test.
    # It went unnoticed because the local virtualenv had it installed while
    # the dependency list did not.
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
permgate = "permgate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/permgate"]

[tool.pytest.ini_options]
# src/ holds the package, . holds eval/ so the evaluation harness can import
# the corpus without being installed as a package of its own.
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: takes more than a second (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "eval", "tools", "loadtest"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "PL"]
ignore = [
    "PLR0913", # too many arguments -- dataclass-backed call signatures are fine
    "PLR2004", # magic value in comparison -- the rule tables are full of them
    # FastAPI's dependency injection is expressed as a call in a default
    # argument. That is the framework's idiom, not an accident.
    "B008",
    # Imports inside functions are deliberate in three places: breaking import
    # cycles in the API layer, keeping `permgate --version` from paying for
    # uvicorn, and keeping the CLI's offline subcommands from opening a database.
    "PLC0415",
    # The evaluation report is written in Chinese on purpose -- it is read by
    # the person whose project this is, not by a tool.
    "RUF001",
    # Exception names here read as facts rather than as error types:
    # `ProjectNotFound` says what happened; `ProjectNotFoundError` says it twice.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
"eval/*" = ["PLR2004", "E501", "PLR0912", "PLR0915"]
"tools/*" = ["PLR2004"]
"tests/*" = ["E501", "PLR2004", "PLR0915"]
# A rule engine is a long function with many branches. Splitting the allowlist
# into five small functions that each call the next would hide the ordering,
# and the ordering is the thing a reviewer needs to read.
"src/permgate/domain/bash_policy.py" = ["PLR0911", "PLR0912"]
# `decide()` is nine returns in a row on purpose. Each one is a numbered step of
# the security model, and the numbering in the docstring refers to them; folding
# them into a table or a chain of helpers would make the ordering -- which is
# the thing to review -- harder to read, not easier.
"src/permgate/domain/engine.py" = ["PLR0911"]
"src/permgate/observability/logging.py" = ["PLW0603"]
# Migration bodies are generated by Alembic from the models. Reformatting
# them by hand makes every future autogenerate produce a spurious diff.
"migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["permgate"]
strict = true
warn_unreachable = true
